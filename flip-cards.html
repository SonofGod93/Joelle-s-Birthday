<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thesaurians: Flip Cards Edition</title></head><body style="margin:0"><div id="jons-flipcards" class="jfc-root">
<style>
.jfc-root{background-color:light-dark(#efe8dd,#171512);color:light-dark(#2c2822,#f5efe7);border-radius:0;width:100%;padding:clamp(18px,4vw,42px);box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.jfc-wrap{max-width:760px;margin:0 auto}.jfc-head{text-align:center;margin-bottom:22px}.jfc-kicker{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;opacity:.6}.jfc-head h2{font-family:Georgia,'Times New Roman',serif;font-size:clamp(30px,6vw,50px);font-weight:500;margin:7px 0 6px}.jfc-head p{font-size:14px;line-height:1.5;opacity:.7;margin:0}
.jfc-stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.jfc-pill{background:light-dark(#fff9ef,#292621);border:1px solid light-dark(rgba(55,45,34,.14),rgba(255,255,255,.12));border-radius:999px;padding:8px 13px;font-size:13px;font-weight:700}
.jfc-card-wrap{perspective:1200px;margin:0 auto;width:min(100%,560px)}.jfc-card{position:relative;width:100%;aspect-ratio:4/3;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1);cursor:pointer}.jfc-card.flipped{transform:rotateY(180deg)}.jfc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;box-shadow:0 18px 42px rgba(45,34,23,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;box-sizing:border-box;border:1px solid rgba(75,62,46,.14)}.jfc-front{background:#fffaf0;color:#2c2620}.jfc-back{background:#5e4b4d;color:#fffaf0;transform:rotateY(180deg);overflow:auto;justify-content:flex-start}.jfc-label{font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;opacity:.65;margin-bottom:14px}.jfc-word{font-family:Georgia,'Times New Roman',serif;font-size:clamp(40px,9vw,72px);line-height:1;font-weight:500}.jfc-pronunciation{font-size:clamp(15px,2.8vw,19px);font-weight:800;letter-spacing:.04em;margin:-6px 0 12px;opacity:.9}.jfc-pos{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;opacity:.72;margin-bottom:12px}.jfc-definition{font-size:14px;line-height:1.5;max-width:420px;margin-bottom:14px;opacity:.92}.jfc-meta{width:100%;max-width:430px;text-align:center;font-size:12.5px;line-height:1.45}.jfc-meta p{margin:0 0 9px}.jfc-meta strong{letter-spacing:.03em}.jfc-prompt{font-family:Georgia,'Times New Roman',serif;font-size:clamp(20px,4.2vw,30px);line-height:1.12;margin:5px 0 10px}.jfc-hint{font-size:13px;line-height:1.45;opacity:.75;max-width:360px}.jfc-tap{margin-top:22px;font-size:12px;font-weight:800;letter-spacing:.08em;opacity:.5}
.jfc-controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.jfc-btn{appearance:none;border:1px solid light-dark(rgba(55,45,34,.2),rgba(255,255,255,.18));background:light-dark(#fffaf0,#2b2924);color:inherit;border-radius:999px;min-height:46px;padding:11px 17px;font-size:14px;font-weight:800;cursor:pointer}.jfc-btn.primary{background:light-dark(#4b4035,#efe2cf);color:light-dark(#fffaf0,#211d18);border-color:transparent}.jfc-btn.good{background:#546b55;color:#fff;border-color:transparent}.jfc-btn.skip{background:#8a6e50;color:#fff;border-color:transparent}.jfc-btn:focus-visible,.jfc-card:focus-visible{outline:3px solid light-dark(#7e6658,#d8bda8);outline-offset:3px}.jfc-btn:disabled{opacity:.4;cursor:not-allowed}
.jfc-mode{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0 18px}.jfc-mode button{appearance:none;border:1px solid light-dark(rgba(55,45,34,.18),rgba(255,255,255,.16));background:transparent;color:inherit;border-radius:999px;padding:9px 13px;min-height:42px;font-weight:800;cursor:pointer}.jfc-mode button.active{background:light-dark(#d9c8b8,#3a342d)}.jfc-answer{display:none;width:100%;max-width:430px;margin:10px auto 0;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.12);font-size:12.5px;line-height:1.45;text-align:center}.jfc-answer.show{display:block}.jfc-difficulty{margin-top:auto;padding-top:18px;font-family:Georgia,'Times New Roman',serif;font-size:clamp(28px,6vw,44px);font-weight:800;letter-spacing:.04em;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.16)}.jfc-footer{text-align:center;margin-top:16px;font-size:12px;opacity:.58}.jfc-live{min-height:18px;margin-top:8px}
@media(max-width:520px){.jfc-root{padding:18px 12px 28px}.jfc-card{aspect-ratio:3/4}.jfc-face{padding:24px}.jfc-controls{gap:8px}.jfc-btn{padding:11px 14px}}
@media(prefers-reduced-motion:reduce){.jfc-card{transition:none}}
</style>
<div class="jfc-wrap">
  <div class="jfc-head">
    <div class="jfc-kicker">Birthday edition</div>
    <h2>Jon’s Flip Cards</h2>
    <p>Pick a mode, read the word, then flip the card to see your challenge.</p>
  </div>

  <div class="jfc-stats">
    <div class="jfc-pill">Score: <span id="jfcScore">0</span></div>
    <div class="jfc-pill">Streak: <span id="jfcStreak">0</span></div>
    <div class="jfc-pill">Card: <span id="jfcCount">1</span></div>
  </div>

  <div class="jfc-mode" aria-label="Choose challenge mode">
    <button type="button" data-mode="synonym">Synonym</button>
    <button type="button" data-mode="antonym">Antonym</button>
    <button type="button" data-mode="both">Both</button>
    <button type="button" data-mode="random" class="active">Random</button>
  </div>

  <div class="jfc-card-wrap">
    <div class="jfc-card" id="jfcCard" role="button" tabindex="0" aria-label="Flip card">
      <div class="jfc-face jfc-front">
        <div class="jfc-label">Your word</div>
        <div class="jfc-word" id="jfcWord">Brilliant</div>
        <div class="jfc-prompt" id="jfcPrompt">Give a synonym.</div>
        <div class="jfc-tap">TAP TO FLIP</div>
      </div>
      <div class="jfc-face jfc-back">
        <div class="jfc-label">Challenge</div>
        <div class="jfc-pronunciation" id="jfcPronunciation"></div>
        <div class="jfc-definition" id="jfcDefinition"></div>
        <div class="jfc-meta" id="jfcMeta"></div>
        <div class="jfc-hint" id="jfcHint">Say your answer out loud before checking it.</div>
        <div class="jfc-answer" id="jfcAnswer"></div>
        <div class="jfc-difficulty" id="jfcDifficulty"></div>
      </div>
    </div>
  </div>

  <div class="jfc-controls">
    <button type="button" class="jfc-btn" id="jfcCheck">🔎 Check answer</button>
    <button type="button" class="jfc-btn good" id="jfcCorrect">✓ Got it</button>
    <button type="button" class="jfc-btn skip" id="jfcSkip">Skip</button>
    <button type="button" class="jfc-btn primary" id="jfcNext">Next card ▶</button>
    <button type="button" class="jfc-btn" id="jfcReset">Reset</button>
  </div>

  <div class="jfc-footer">
    Tap the card or press Space to flip it.
    <div class="jfc-live" id="jfcLive" aria-live="polite"></div>
  </div>
</div>

ronunciation:'OB-stuh-nit',definition:'Stubbornly refusing to change one’s opinion or course of action.'},{word:'Pragmatic',pronunciation:'prag-MAT-ik',definition:'Focused on practical results rather than theory or ideals alone.'},{word:'Prodigious',pronunciation:'pruh-DIJ-us',definition:'Remarkably great in size, degree, ability, or extent.'},{word:'Prolific',pronunciation:'pruh-LIF-ik',definition:'Producing a large amount of work, results, or creations.'},{word:'Quixotic',pronunciation:'kwik-SOT-ik',definition:'Idealistic in an impractical or unrealistic way.'},{word:'Reticent',pronunciation:'RET-ih-suhnt',definition:'Reserved and not revealing one’s thoughts or feelings readily.'},{word:'Scrupulous',pronunciation:'SKROO-pyuh-lus',definition:'Very careful to act correctly, honestly, and precisely.'},{word:'Stoic',pronunciation:'STOH-ik',definition:'Enduring pain or difficulty without openly showing distress.'},{word:'Trenchant',pronunciation:'TREN-chuhnt',definition:'Sharp, forceful, and effective in expression or analysis.'},{word:'Ubiquitous',pronunciation:'yoo-BIK-wih-tus',definition:'Present, appearing, or found everywhere.'},{word:'Venerable',pronunciation:'VEN-er-uh-buhl',definition:'Respected because of age, wisdom, character, or achievement.'},{word:'Winsome',pronunciation:'WIN-suhm',definition:'Sweetly charming and appealing.'},{word:'Wistful',pronunciation:'WIST-fuhl',definition:'Having a quiet, thoughtful longing for something.'},{word:'Acrimonious',pronunciation:'ak-rih-MOH-nee-us',definition:'Bitter, angry, and harsh in tone or manner.'},{word:'Aplomb',pronunciation:'uh-PLOM',definition:'Self-confidence and composure in a difficult situation.'},{word:'Assiduous',pronunciation:'uh-SIJ-oo-us',definition:'Showing persistent, careful, and hardworking attention.'},{word:'Capricious',pronunciation:'kuh-PRISH-us',definition:'Given to sudden, unpredictable changes in mood or behavior.'},{word:'Demure',pronunciation:'dih-MYOOR',definition:'Reserved, modest, an     Exuberant:{origin:'From Latin exuberare, “to be abundant, overflow.”',roots:'ex- = out; uber = fertile or abundant',nuance:'Exuberant describes energy or enthusiasm that seems to overflow its bounds.'},
    Forthright:{origin:'From forth + right, literally “straight forward.”',roots:'forth = forward; right = straight',nuance:'Forthright values directness and honesty without unnecessary evasion.'},
    Insightful:{origin:'From insight + the suffix -ful.',roots:'in + sight = seeing inwardly; -ful = full of',nuance:'Insightful describes an observation that reveals something beneath the obvious surface.'},
    Intuitive:{origin:'From Latin intueri, “to look at, contemplate.”',roots:'in- = upon; tueri = look or watch',nuance:'Intuitive knowledge feels immediate rather than consciously reasoned step by step.'},
    Judicious:{origin:'From Latin judicium, “judgment.”',roots:'jus = law or right; dicere = say',nuance:'Judicious emphasizes careful, sensible judgment after weighing relevant factors.'},
    Loyal:{origin:'From Old French loial, from Latin legalis, “lawful, faithful.”',roots:'leg- = law',nuance:'Loyal implies steadfast allegiance or support over time, especially when tested.'},
    Nurturing:{origin:'From Latin nutrire, “to nourish.”',roots:'nutr- = nourish or feed',nuance:'Nurturing means supporting growth through sustained care, not simply showing affection.'},
    Perceptive:{origin:'From Latin percipere, “to seize, understand.”',roots:'per- = through; capere = take',nuance:'Perceptive emphasizes noticing and interpreting subtleties that others may miss.'},
    Prudent:{origin:'From Latin prudens, shortened from providens, “foreseeing.”',roots:'pro- = forward; videre = see',nuance:'Prudent means using foresight and restraint to avoid unnecessary risk.'},
    Resourceful:{origin:'From resource, from Old French resourdre, “to rise again.”',roots:'re- = again; source = arise',nuance:'Resourceful means finding workable solutions with whatever means are available.'},
    Sincere:{origin:'From Latin sincerus, “clean, pure, genuine.”',roots:'sincer- = pure or genuine',nuance:'Sincere stresses that expressed feeling or intention is genuine rather than performed.'},
    Spirited:{origin:'From spirit, from Latin spiritus, “breath, spirit.”',roots:'spir- = breathe',nuance:'Spirited suggests lively courage, energy, or determination.'},
    Tactful:{origin:'From tact, from Latin tactus, “touch.”',roots:'tangere/tact- = touch',nuance:'Tactful speech “touches” a sensitive situation carefully without needless offense.'},
    Unassuming:{origin:'From un- + assuming.',roots:'un- = not; assume = take to oneself',nuance:'Unassuming means modest and free of self-importance or attention-seeking.'},
    Versatile:{origin:'From Latin versatilis, “turning easily.”',roots:'vers- = turn',nuance:'Versatile describes someone or something able to turn effectively among many uses or roles.'},
    Whimsical:{origin:'From whim, probably related to whim-wham, “fanciful object or notion.”',roots:'whim = sudden fanciful idea',nuance:'Whimsical is playfully imaginative and odd in a charming rather than chaotic way.'},
    Zealous:{origin:'From Greek zelos, “ardor, eager rivalry.”',roots:'zel- = fervor or zeal',nuance:'Zealous describes intense, energetic devotion to a cause or pursuit.'},
    Altruistic:{origin:'From French altruisme, coined from Italian altrui, “of others.”',roots:'alter = other',nuance:'Altruistic specifically centers the welfare of others rather than one’s own advantage.'},
    Amiable:{origin:'From Latin amicabilis, “friendly,” from amicus, “friend.”',roots:'am- = love; amic- = friend',nuance:'Amiable describes a naturally pleasant, easy-to-like manner.'},
    Articulate:{origin:'From Latin articulare, “to divide into joints, express distinctly.”',roots:'articul- = joint or distinct segment',nuance:'Articulate means expressing thought clearly and distinctly, especially in speech.'},
    Authentic:{origin:'From Greek authentikos, “original, genuine, principal.”',roots:'authent- = genuine or authoritative',nuance:'Authentic means true to origin, identity, or character rather than imitation.'},
    Charismatic:{origin:'From Greek charisma, “gift, favor.”',roots:'charis = grace or favor',nuance:'Charismatic describes a compelling personal presence that attracts or inspires others.'},
    Clever:{origin:'From Middle English, probably meaning “skillful, dexterous.”',roots:'Germanic root associated with skill or readiness',nuance:'Clever praises quickness in understanding or devising effective solutions.'},
    Composed:{origin:'From Latin componere, “to put together.”',roots:'com- = together; ponere = place',nuance:'Composed suggests one’s emotions are held together in calm, orderly control.'},
    Decisive:{origin:'From Latin decidere, “to cut off, settle.”',roots:'de- = off; caedere = cut',nuance:'Decisive implies bringing uncertainty to an end through a firm choice.'},
    Devoted:{origin:'From Latin devovere, “to vow, dedicate.”',roots:'de- = fully; vovere = vow',nuance:'Devoted means committed with sustained affection, loyalty, or dedication.'},
    Diligent:{origin:'From Latin diligere, “to value highly, take delight in.”',roots:'di-/dis- = apart; legere = choose',nuance:'Diligent emphasizes steady, careful effort maintained over time.'},
    Dynamic:{origin:'From Greek dynamis, “power, force.”',roots:'dynam- = power',nuance:'Dynamic suggests active energy, force, or capacity for change.'},
    Encouraging:{origin:'From courage, through Old French encoragier, “to give heart.”',roots:'en- = put into; cor = heart',nuance:'Encouraging literally carries the idea of putting courage into someone.'},
    Faithful:{origin:'From faith + the suffix -ful.',roots:'faith = trust or loyalty; -ful = full of',nuance:'Faithful stresses constancy and dependability across time and testing.'},
    Gracious:{origin:'From Latin gratia, “favor, grace, goodwill.”',roots:'grat- = pleasing, thankful, favored',nuance:'Gracious combines courtesy with generosity of manner or spirit.'},
    Grounded:{origin:'From ground, used figuratively for a stable foundation.',roots:'ground = earth or foundation',nuance:'Grounded describes emotional steadiness and contact with practical reality.'},
    Innovative:{origin:'From Latin innovare, “to renew, make new.”',roots:'in- = into; nov- = new',nuance:'Innovative focuses on introducing genuinely new methods, ideas, or forms.'},
    Observant:{origin:'From Latin observare, “to watch, heed.”',roots:'ob- = toward; servare = watch or keep',nuance:'Observant emphasizes alert attention to details that others may overlook.'},
    Original:{origin:'From Latin originalis, “of the beginning.”',roots:'origin- = beginning or source',nuance:'Original means arising from one’s own source rather than copying another.'},
    Reflective:{origin:'From Latin reflectere, “to bend back.”',roots:'re- = back; flectere = to bend',nuance:'Reflective suggests turning an idea or experience back over in the mind for careful consideration.'},
    Reliable:{origin:'From rely + the suffix -able.',roots:'rely = depend; -able = capable of',nuance:'Reliable describes something or someone that can consistently be depended upon.'},
    Selfless:{origin:'From self + the suffix -less, “without.”',roots:'self = one’s own person; -less = without',nuance:'Selfless means acting with unusually little concern for personal advantage.'},
    Skillful:{origin:'From skill + the suffix -ful.',roots:'skill = practiced ability; -ful = full of',nuance:'Skillful emphasizes demonstrated competence shaped by practice or expertise.'},
    Tenderhearted:{origin:'From tender + hearted.',roots:'tender = gentle; heart = seat of feeling',nuance:'Tenderhearted describes a person readily moved toward compassion and gentle care.'},
    Visionary:{origin:'From vision, from Latin visio, “seeing.”',roots:'vid-/vis- = see',nuance:'Visionary describes the ability to imagine possibilities beyond present conditions, often with creative foresight.'},
    Witty:{origin:'From wit, from Old English witt, “understanding, intelligence.”',roots:'wit = knowledge or mental quickness',nuance:'Witty combines quick intelligence with amusing or striking expression.'},
    Abstemious:{origin:'From Latin abstemius, “abstaining from wine.”',roots:'abs- = away from; temetum = intoxicating drink',nuance:'Abstemious now means habitually restrained, especially in food or drink.'},
    Ambivalent:{origin:'From German Ambivalenz, built from Latin roots meaning “both strengths.”',roots:'ambi- = both; valent- = strong',nuance:'Ambivalent means genuinely pulled in opposing emotional directions at once.'},
    Austere:{origin:'From Greek austeros, “harsh, severe, dry.”',roots:'auster- = severe or harsh',nuance:'Austere suggests deliberate plainness, strictness, or lack of comfort and ornament.'},
    Bellicose:{origin:'From Latin bellicosus, “warlike.”',roots:'bellum = war',nuance:'Bellicose describes an aggressive eagerness to fight, argue, or provoke conflict.'},
    Circumspect:{origin:'From Latin circumspectus, “looking around.”',roots:'circum- = around; specere = look',nuance:'Circumspect means scanning the whole situation for risks before acting.'},
    Cogent:{origin:'From Latin cogere, “to drive together, compel.”',roots:'co- = together; agere = drive',nuance:'A cogent argument compels agreement through clarity and logical force.'},
    Convivial:{origin:'From Latin convivium, “feast, banquet.”',roots:'con- = together; vivere = live',nuance:'Convivial describes a sociable, festive atmosphere of enjoyable company.'},
    Copious:{origin:'From Latin copia, “abundance.”',roots:'copi- = plenty',nuance:'Copious emphasizes large quantity, often more than merely sufficient.'},
    Deferential:{origin:'From Latin deferre, “to carry down or yield.”',roots:'de- = down; ferre = carry',nuance:'Deferential behavior yields respectfully to another person’s status, judgment, or preference.'},
    Didactic:{origin:'From Greek didaktikos, “apt at teaching.”',roots:'didask- = teach',nuance:'Didactic can simply mean instructional, but it may imply teaching that feels overly moralizing or heavy-handed.'},
    Diffident:{origin:'From Latin diffidere, “to distrust.”',roots:'dis- = apart; fidere = trust',nuance:'Diffident means lacking confidence in oneself, often producing reserve or shyness.'},
    Eclectic:{origin:'From Greek eklektikos, “selective.”',roots:'ek- = out; legein = choose',nuance:'Eclectic describes choosing from varied sources rather than following a single style or school.'},
    Effervescent:{origin:'From Latin effervescere, “to boil up.”',roots:'ex-/ef- = out; fervescere = grow hot',nuance:'Effervescent compares lively enthusiasm to bubbles rising and overflowing.'},
    Enigmatic:{origin:'From Greek ainigma, “riddle.”',roots:'enigmat- = riddle or mystery',nuance:'Enigmatic describes something intriguingly difficult to interpret or understand.'},
    Ephemeral:{origin:'From Greek ephemeros, “lasting only a day.”',roots:'epi- = for; hemera = day',nuance:'Ephemeral emphasizes very brief duration, often with a sense of transience.'},
    Erudite:{origin:'From Latin eruditus, literally “educated out of roughness.”',roots:'e- = out; rudis = rough or untrained',nuance:'Erudite describes deep scholarly learning rather than ordinary intelligence.'},
    Esoteric:{origin:'From Greek esoterikos, “inner.”',roots:'eso = within',nuance:'Esoteric means intended for or understood by a small circle with specialized knowledge.'},
    Exigent:{origin:'From Latin exigere, “to demand, drive out.”',roots:'ex- = out; agere = drive',nuance:'Exigent describes circumstances that press urgently for attention or action.'},
    Gregarious:{origin:'From Latin gregarius, “belonging to a flock.”',roots:'greg- = flock or group',nuance:'Gregarious suggests naturally seeking and enjoying the company of others.'},
    Impetuous:{origin:'From Latin impetus, “attack, force, rush.”',roots:'in- = toward; petere = seek or rush at',nuance:'Impetuous action is driven by sudden force or feeling before careful thought catches up.'},
    Incisive:{origin:'From Latin incidere, “to cut into.”',roots:'in- = into; caedere = cut',nuance:'Incisive thought cuts quickly to the essential point with sharp clarity.'},
    Ineffable:{origin:'From Latin ineffabilis, “that cannot be spoken.”',roots:'in- = not; effari = to utter',nuance:'Ineffable is reserved for something so profound, beautiful, or extreme that language feels inadequate.'},
    Intrepid:{origin:'From Latin intrepidus, “not alarmed.”',roots:'in- = not; trepidus = alarmed or agitated',nuance:'Intrepid describes fearless steadiness in dangerous or uncertain situations.'},
    Laconic:{origin:'From Laconia, the region of ancient Sparta, whose people were famous for brief speech.',roots:'Laconia = Spartan region associated with brevity',nuance:'Laconic means using very few words, often intentionally; taciturn describes someone who is habitually quiet.'},
    Loquacious:{origin:'From Latin loquax, “talkative.”',roots:'loqu- = speak',nuance:'Loquacious specifically means inclined to talk a great deal.'},
    Lucid:{origin:'From Latin lucidus, “bright, clear.”',roots:'luc- = light',nuance:'Lucid transfers the idea of brightness to thought or explanation: clear enough to see through.'},
    Munificent:{origin:'From Latin munificus, “bountiful, generous.”',roots:'munus = gift; facere = make or do',nuance:'Munificent implies exceptionally lavish generosity, beyond ordinary giving.'},
    Nebulous:{origin:'From Latin nebula, “mist, cloud.”',roots:'nebul- = cloud or mist',nuance:'Nebulous describes an idea whose edges are clouded, vague, or difficult to define.'},
    Obstinate:{origin:'From Latin obstinatus, “resolved, persistent.”',roots:'ob- = against; stare = stand',nuance:'Obstinate means stubbornly standing against pressure to change.'},
    Pragmatic:{origin:'From Greek pragmatikos, “fit for business or action.”',roots:'pragma = deed or practical matter',nuance:'Pragmatic focuses on what works in practice rather than what is ideal in theory.'},
    Prodigious:{origin:'From Latin prodigiosus, “marvelous, portentous.”',roots:'prodigium = omen or marvel',nuance:'Prodigious describes something impressively great in amount, scale, or ability.'},
    Prolific:{origin:'From Latin proles, “offspring,” plus facere, “make.”',roots:'proles = offspring; fic/fac = make',nuance:'Prolific emphasizes producing a large quantity of work, ideas, or results.'},
    Quixotic:{origin:'From Don Quixote, Cervantes’s idealistic fictional knight.',roots:'Quixote = literary source name',nuance:'Quixotic praises idealism while implying that the plan is impractical or detached from reality.'},
    Reticent:{origin:'From Latin reticere, “to keep silent.”',roots:'re- = back; tacere = be silent',nuance:'Reticent means holding back thoughts or feelings rather than simply being a person of few words.'},
    Scrupulous:{origin:'From Latin scrupulus, “small sharp stone,” figuratively a worry or moral doubt.',roots:'scrup- = small sharp stone; moral hesitation',nuance:'Scrupulous describes meticulous care driven by conscience, correctness, or precision.'},
    Stoic:{origin:'From Greek Stoa Poikile, the “Painted Porch” where Stoic philosophers taught.',roots:'stoa = porch',nuance:'Stoic in ordinary use means enduring hardship without outward complaint, though the philosophy is broader than emotional suppression.'},
    Trenchant:{origin:'From Old French trenchier, “to cut.”',roots:'trench- = cut',nuance:'Trenchant speech cuts sharply and effectively to the point.'},
    Ubiquitous:{origin:'From Latin ubique, “everywhere.”',roots:'ubi = where; -que = every/and',nuance:'Ubiquitous means so widely present that it seems to be everywhere at once.'},
    Venerable:{origin:'From Latin venerabilis, “worthy of reverence.”',roots:'vener- = revere or honor',nuance:'Venerable suggests respect earned through age, character, wisdom, or long achievement.'},
    Winsome:{origin:'From Old English wynsum, “pleasant, delightful.”',roots:'wyn = joy or pleasure; -some = characterized by',nuance:'Winsome describes a sweet, gentle charm that naturally attracts affection.'},
    Wistful:{origin:'Probably from obsolete wistly, “intently,” related to wit, “know.”',roots:'wist = knew or was aware',nuance:'Wistful combines thoughtfulness with a soft, often nostalgic longing.'},
    Acrimonious:{origin:'From Latin acrimonia, “sharpness, pungency.”',roots:'acer/acr- = sharp',nuance:'Acrimonious describes hostility that is verbally sharp, bitter, and cutting.'},
    Aplomb:{origin:'From French à plomb, literally “according to the plumb line.”',roots:'plomb = lead weight used for vertical balance',nuance:'Aplomb is figurative balance: confident composure when a situation could unsettle you.'},
    Assiduous:{origin:'From Latin assiduus, “sitting close, constantly present.”',roots:'ad- = near; sedere = sit',nuance:'Assiduous describes sustained, attentive effort over time.'},
    Capricious:{origin:'From Italian capriccio, “sudden fancy or whim.”',roots:'capriccio = whim or sudden change',nuance:'Capricious behavior changes suddenly according to impulse rather than stable principle.'},
    Demure:{origin:'From Old French demore, associated with staying or remaining, later “reserved.”',roots:'demeur- = remain or stay',nuance:'Demure suggests modest, restrained composure, especially in outward manner.'},
    Ebullient:{origin:'From Latin ebullire, “to bubble or boil up.”',roots:'e- = out; bullire = boil',nuance:'Ebullient describes enthusiasm that seems to bubble up irrepressibly.'},
    Fervent:{origin:'From Latin fervens, “boiling, glowing hot.”',roots:'ferv- = boil or burn',nuance:'Fervent applies the image of heat to intense sincerity, passion, or devotion.'},
    Immutable:{origin:'From Latin immutabilis, “unchangeable.”',roots:'in-/im- = not; mutare = change',nuance:'Immutable means incapable of change, stronger than merely stable or consistent.'},
    Inimitable:{origin:'From Latin inimitabilis, “not able to be imitated.”',roots:'in- = not; imitari = imitate',nuance:'Inimitable praises a distinctive quality so singular that copying it would fail.'},
    Magniloquent:{origin:'From Latin magniloquus, “speaking grandly.”',roots:'magnus = great; loqui = speak',nuance:'Magniloquent describes lofty, grandiose language, often with a hint of excess.'},
    Nonchalant:{origin:'From French nonchaloir, “not to care.”',roots:'non = not; chaloir = concern',nuance:'Nonchalant suggests casual unconcern, whether genuinely calm or deliberately displayed.'},
    Nuanced:{origin:'From French nuance, “shade of color.”',roots:'nue = cloud; nuance = subtle shading',nuance:'Nuanced extends the idea of color shading to fine distinctions in meaning, feeling, or judgment.'},
    Pensive:{origin:'From Latin pensare, “to weigh, consider.”',roots:'pens- = weigh or ponder',nuance:'Pensive means deeply thoughtful, often with a quiet or slightly melancholy emotional tone.'},
    Piquant:{origin:'From French piquant, “pricking, stimulating.”',roots:'piquer = prick or sting',nuance:'Piquant describes something pleasantly sharp, stimulating, or intriguingly provocative.'},
    Reverent:{origin:'From Latin revereri, “to stand in awe of, respect.”',roots:'re- = back; vereri = fear or respect',nuance:'Reverent describes deep respect colored by awe, devotion, or sacred regard.'},
    Subtle:{origin:'From Latin subtilis, “finely woven, delicate.”',roots:'sub- = under; tela = web or fabric',nuance:'Subtle describes distinctions that are fine, delicate, or not immediately obvious.'},
    Unflappable:{origin:'From un- + flappable; flap once meant “become agitated.”',roots:'un- = not; flap = become agitated',nuance:'Unflappable describes someone who remains calm when circumstances invite panic or confusion.'},
    Veracious:{origin:'From Latin verax, “truthful.”',roots:'ver- = true',nuance:'Veracious specifically praises truthfulness and factual accuracy.'}
  };
  function fallbackPos(word){
    if(['Dignity','Kindness','Understanding','Equanimity','Aplomb'].includes(word))return 'noun';
    return 'adjective';
  }
  function difficultyFor(word){return thesaurianWords.has(word)?'THESAURIAN':'WORD NERD';}
  function pointValue(word){const base=difficultyFor(word)==='THESAURIAN'?2:1;return challenge==='both'?base*2:base;}
  function answerText(word){
    const a=answers[word]||{syn:[],ant:[]};
    if(challenge==='both')return `<strong>Synonym examples:</strong> ${a.syn.join(' · ')}<br><strong>Antonym examples:</strong> ${a.ant.join(' · ')}`;
    const list=challenge==='antonym'?a.ant:a.syn;
    return `<strong>Accepted examples:</strong> ${list.join(' · ')}`;
  }
  function renderMeta(current){
    const ex=extras[current.word]||{origin:'Origin information unavailable.',roots:'Root information unavailable.',nuance:current.definition};
    const difficulty=difficultyFor(current.word);
    const rows=[];
    const normalize=s=>String(s||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>3&&!['that','with','from','this','than','into','when','often','means','describes','describe','suggests','emphasizes','implies'].includes(w));
    const defWords=new Set(normalize(current.definition));
    const nuanceWords=normalize(ex.nuance);
    const overlap=nuanceWords.length?nuanceWords.filter(w=>defWords.has(w)).length/nuanceWords.length:0;
    let nuance=ex.nuance;
    if(!nuance||overlap>.52){
      nuance=`In use, the word carries the older image behind it — ${ex.roots||ex.origin} — which gives it more texture than the basic definition alone.`;
    }
    if(ex.origin)rows.push(`<p><strong>Origin:</strong> ${ex.origin}</p>`);
    if(ex.roots)rows.push(`<p><strong>Word Root:</strong> ${ex.roots}</p>`);
    if(nuance)rows.push(`<p><strong>Nuance:</strong> ${nuance}</p>`);
    if(ex.funFact&&ex.funFact!==ex.origin)rows.push(`<p><strong>Did you know?</strong> ${ex.funFact}</p>`);
    metaEl.innerHTML=rows.join('');
    difficultyEl.textContent=difficulty==='THESAURIAN'?'🧠 THESAURIAN':'✨ WORD NERD';
  }
  function newCard(){
    card.classList.remove('flipped');
    scored=false;
    answerEl.classList.remove('show');
    answerEl.innerHTML='';
    current=pickWord();
    chooseChallenge();
    wordEl.textContent=current.word;
    pronunciationEl.textContent=current.pronunciation;
    definitionEl.textContent=current.definition;
    renderMeta(current);
    promptEl.textContent=promptFor(current.word);
    countEl.textContent=String(count);
    live.textContent=`Card ${count}: ${current.word}. ${challenge==='both'?'Synonym and antonym':challenge} challenge.`;
  }
  function flip(){card.classList.toggle('flipped');}
  function markCorrect(){
    if(scored)return;
    scored=true;const points=pointValue(current.word);score+=points;streak+=1;scoreEl.textContent=score;streakEl.textContent=streak;live.textContent=`${points} point${points===1?'':'s'} scored.`;
  }
  function skip(){
    if(!scored){streak=0;streakEl.textContent=streak;scored=true;}
    live.textContent='Skipped.';
  }
  function next(){count+=1;newCard();}
  function reset(){score=0;streak=0;count=1;scoreEl.textContent='0';streakEl.textContent='0';newCard();live.textContent='Game reset.';}
  function checkAnswer(){
    if(!card.classList.contains('flipped'))card.classList.add('flipped');
    answerEl.innerHTML=answerText(current.word);
    answerEl.classList.add('show');
    live.textContent='Answer examples revealed. Score yourself with Got it or Skip.';
  }

  modeButtons.forEach(btn=>btn.addEventListener('click',()=>{
    mode=btn.dataset.mode;
    modeButtons.forEach(b=>b.classList.toggle('active',b===btn));
    count+=1;newCard();
  }));

  card.addEventListener('click',flip);
  card.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();}});
  checkBtn.addEventListener('click',checkAnswer);
  correctBtn.addEventListener('click',markCorrect);
  skipBtn.addEventListener('click',skip);
  nextBtn.addEventListener('click',next);
  resetBtn.addEventListener('click',reset);
  newCard();
})();
</script>
