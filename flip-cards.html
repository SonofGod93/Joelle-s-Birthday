<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flip Cards</title></head><body style="margin:0"><div id="jons-flipcards" class="jfc-root">
<style>
.jfc-root{background-color:light-dark(#efe8dd,#171512);color:light-dark(#2c2822,#f5efe7);border-radius:0;width:100%;padding:clamp(18px,4vw,42px);box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.jfc-wrap{max-width:760px;margin:0 auto}.jfc-head{text-align:center;margin-bottom:22px}.jfc-kicker{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;opacity:.6}.jfc-head h2{font-family:Georgia,'Times New Roman',serif;font-size:clamp(30px,6vw,50px);font-weight:500;margin:7px 0 6px}.jfc-head p{font-size:14px;line-height:1.5;opacity:.7;margin:0}
.jfc-stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.jfc-pill{background:light-dark(#fff9ef,#292621);border:1px solid light-dark(rgba(55,45,34,.14),rgba(255,255,255,.12));border-radius:999px;padding:8px 13px;font-size:13px;font-weight:700}
.jfc-card-wrap{perspective:1200px;margin:0 auto;width:min(100%,560px)}.jfc-card{position:relative;width:100%;aspect-ratio:4/3;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1);cursor:pointer}.jfc-card.flipped{transform:rotateY(180deg)}.jfc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;box-shadow:0 18px 42px rgba(45,34,23,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;box-sizing:border-box;border:1px solid rgba(75,62,46,.14)}.jfc-front{background:#fffaf0;color:#2c2620}.jfc-back{background:#5e4b4d;color:#fffaf0;transform:rotateY(180deg)}.jfc-label{font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;opacity:.65;margin-bottom:14px}.jfc-word{font-family:Georgia,'Times New Roman',serif;font-size:clamp(40px,9vw,72px);line-height:1;font-weight:500}.jfc-pronunciation{font-size:clamp(15px,2.8vw,19px);font-weight:800;letter-spacing:.04em;margin:-6px 0 12px;opacity:.9}.jfc-definition{font-size:14px;line-height:1.5;max-width:420px;margin-bottom:16px;opacity:.92}.jfc-prompt{font-family:Georgia,'Times New Roman',serif;font-size:clamp(24px,5vw,40px);line-height:1.12;margin-bottom:12px}.jfc-hint{font-size:13px;line-height:1.45;opacity:.75;max-width:360px}.jfc-tap{margin-top:22px;font-size:12px;font-weight:800;letter-spacing:.08em;opacity:.5}
.jfc-controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.jfc-btn{appearance:none;border:1px solid light-dark(rgba(55,45,34,.2),rgba(255,255,255,.18));background:light-dark(#fffaf0,#2b2924);color:inherit;border-radius:999px;min-height:46px;padding:11px 17px;font-size:14px;font-weight:800;cursor:pointer}.jfc-btn.primary{background:light-dark(#4b4035,#efe2cf);color:light-dark(#fffaf0,#211d18);border-color:transparent}.jfc-btn.good{background:#546b55;color:#fff;border-color:transparent}.jfc-btn.skip{background:#8a6e50;color:#fff;border-color:transparent}.jfc-btn:focus-visible,.jfc-card:focus-visible{outline:3px solid light-dark(#7e6658,#d8bda8);outline-offset:3px}.jfc-btn:disabled{opacity:.4;cursor:not-allowed}
.jfc-mode{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0 18px}.jfc-mode button{appearance:none;border:1px solid light-dark(rgba(55,45,34,.18),rgba(255,255,255,.16));background:transparent;color:inherit;border-radius:999px;padding:9px 13px;min-height:42px;font-weight:800;cursor:pointer}.jfc-mode button.active{background:light-dark(#d9c8b8,#3a342d)}.jfc-footer{text-align:center;margin-top:16px;font-size:12px;opacity:.58}.jfc-live{min-height:18px;margin-top:8px}
@media(max-width:520px){.jfc-root{padding:18px 12px 28px}.jfc-card{aspect-ratio:3/4}.jfc-face{padding:24px}.jfc-controls{gap:8px}.jfc-btn{padding:11px 14px}}
@media(prefers-reduced-motion:reduce){.jfc-card{transition:none}}
</style>
<div class="jfc-wrap">
  <div class="jfc-head">
    <div class="jfc-kicker">Birthday edition</div>
    <h2>Jon’s Flip Cards</h2>
    <p>Pick a mode, read the word, then flip the card to see your challenge.</p>
  </div>
  <div class="jfc-stats"><div class="jfc-pill">Score: <span id="jfcScore">0</span></div><div class="jfc-pill">Streak: <span id="jfcStreak">0</span></div><div class="jfc-pill">Card: <span id="jfcCount">1</span></div></div>
  <div class="jfc-mode" aria-label="Choose challenge mode"><button type="button" data-mode="synonym">Synonyms</button><button type="button" data-mode="antonym">Antonyms</button><button type="button" data-mode="both" class="active">Both</button><button type="button" data-mode="random">Random</button></div>
  <div class="jfc-card-wrap"><div class="jfc-card" id="jfcCard" role="button" tabindex="0" aria-label="Flip card"><div class="jfc-face jfc-front"><div class="jfc-label">Your word</div><div class="jfc-word" id="jfcWord">Brilliant</div><div class="jfc-tap">TAP TO FLIP</div></div><div class="jfc-face jfc-back"><div class="jfc-label">Challenge</div><div class="jfc-pronunciation" id="jfcPronunciation"></div><div class="jfc-definition" id="jfcDefinition"></div><div class="jfc-prompt" id="jfcPrompt">Give a synonym and an antonym.</div><div class="jfc-hint" id="jfcHint">Say your answer out loud, then score yourself.</div></div></div></div>
  <div class="jfc-controls"><button type="button" class="jfc-btn good" id="jfcCorrect">✓ Got it</button><button type="button" class="jfc-btn skip" id="jfcSkip">Skip</button><button type="button" class="jfc-btn primary" id="jfcNext">Next card ▶</button><button type="button" class="jfc-btn" id="jfcReset">Reset</button></div>
  <div class="jfc-footer">Tap the card or press Space to flip it.<div class="jfc-live" id="jfcLive" aria-live="polite"></div></div>
</div>
<script>
(()=>{
  const root=document.getElementById('jons-flipcards');
  const card=root.querySelector('#jfcCard');
  const wordEl=root.querySelector('#jfcWord');
  const pronunciationEl=root.querySelector('#jfcPronunciation');
  const definitionEl=root.querySelector('#jfcDefinition');
  const promptEl=root.querySelector('#jfcPrompt');
  const scoreEl=root.querySelector('#jfcScore');
  const streakEl=root.querySelector('#jfcStreak');
  const countEl=root.querySelector('#jfcCount');
  const correctBtn=root.querySelector('#jfcCorrect');
  const skipBtn=root.querySelector('#jfcSkip');
  const nextBtn=root.querySelector('#jfcNext');
  const resetBtn=root.querySelector('#jfcReset');
  const live=root.querySelector('#jfcLive');
  const modeBtns=[...root.querySelectorAll('[data-mode]')];
  const words=[
    {word:'Brilliant',pronunciation:'BRIL-yuhnt',definition:'Exceptionally clever, talented, or impressive.'},{word:'Gentle',pronunciation:'JEN-tuhl',definition:'Kind, mild, and considerate in manner or behavior.'},{word:'Joyful',pronunciation:'JOY-fuhl',definition:'Feeling, showing, or causing great happiness.'},{word:'Rare',pronunciation:'rair',definition:'Uncommon, unusual, or especially valuable because of scarcity.'},{word:'Genuine',pronunciation:'JEN-yoo-in',definition:'Sincere, authentic, and truly what it appears to be.'},{word:'Peaceful',pronunciation:'PEES-fuhl',definition:'Calm, quiet, and free from disturbance or conflict.'},{word:'Creative',pronunciation:'kree-AY-tiv',definition:'Able to produce original ideas, designs, or works.'},{word:'Dignity',pronunciation:'DIG-nuh-tee',definition:'A composed sense of self-respect and honorable worth.'},{word:'Kindness',pronunciation:'KYND-nis',definition:'The quality of being friendly, generous, and considerate.'},{word:'Understanding',pronunciation:'un-der-STAN-ding',definition:'Sympathetic awareness of another person’s feelings or situation.'},{word:'Graceful',pronunciation:'GRAYS-fuhl',definition:'Elegant, poised, or pleasing in movement, manner, or form.'},{word:'Considerate',pronunciation:'kuhn-SID-er-it',definition:'Thoughtful of the feelings, needs, and comfort of others.'},{word:'Capable',pronunciation:'KAY-puh-buhl',definition:'Having the ability, skill, or qualities needed to do something well.'},{word:'Imaginative',pronunciation:'ih-MAJ-uh-nuh-tiv',definition:'Inventive and able to form vivid or original ideas.'},{word:'Vibrant',pronunciation:'VY-bruhnt',definition:'Full of energy, life, color, or enthusiasm.'},{word:'Patient',pronunciation:'PAY-shuhnt',definition:'Able to endure delay, difficulty, or frustration calmly.'},{word:'Courageous',pronunciation:'kuh-RAY-jus',definition:'Showing bravery in the face of fear or difficulty.'},{word:'Thoughtful',pronunciation:'THAWT-fuhl',definition:'Showing careful consideration for others or for an idea.'},{word:'Radiant',pronunciation:'RAY-dee-uhnt',definition:'Shining brightly or expressing great happiness and vitality.'},{word:'Steady',pronunciation:'STED-ee',definition:'Firm, dependable, and not easily shaken or changed.'},{word:'Delightful',pronunciation:'dih-LYTE-fuhl',definition:'Highly pleasing, charming, or enjoyable.'},{word:'Tender',pronunciation:'TEN-der',definition:'Showing gentleness, care, and affection.'},{word:'Curious',pronunciation:'KYOOR-ee-us',definition:'Eager to know, learn, or investigate something.'},{word:'Lively',pronunciation:'LYVE-lee',definition:'Full of energy, spirit, and activity.'},{word:'Intentional',pronunciation:'in-TEN-shuh-nuhl',definition:'Done deliberately and with purpose.'},{word:'Warm',pronunciation:'wawrm',definition:'Friendly, affectionate, enthusiastic, or emotionally welcoming.'},{word:'Resilient',pronunciation:'rih-ZIL-yuhnt',definition:'Able to recover and adapt after difficulty or stress.'},{word:'Humble',pronunciation:'HUM-buhl',definition:'Modest and not excessively proud of one’s importance or ability.'},{word:'Hopeful',pronunciation:'HOHP-fuhl',definition:'Feeling or inspiring optimism about what may happen.'},{word:'Generous',pronunciation:'JEN-er-us',definition:'Willing to give freely of time, resources, attention, or kindness.'},{word:'Perspicacious',pronunciation:'pur-spih-KAY-shus',definition:'Having a sharp mind and keen insight into things.'},{word:'Magnanimous',pronunciation:'mag-NAN-uh-mus',definition:'Generous and forgiving, especially toward a rival or someone less powerful.'},{word:'Equanimity',pronunciation:'ee-kwuh-NIM-uh-tee',definition:'Mental calmness and composure, especially in a difficult situation.'},{word:'Fastidious',pronunciation:'fa-STID-ee-us',definition:'Very attentive to detail and concerned with accuracy or cleanliness.'},{word:'Sagacious',pronunciation:'suh-GAY-shus',definition:'Having good judgment and practical wisdom.'},{word:'Sanguine',pronunciation:'SANG-gwin',definition:'Optimistic or positive, especially in a difficult situation.'},{word:'Taciturn',pronunciation:'TAS-ih-turn',definition:'Reserved in speech; using few words.'},{word:'Mercurial',pronunciation:'mur-KYOOR-ee-uhl',definition:'Changing mood or behavior quickly and unpredictably.'},{word:'Mellifluous',pronunciation:'muh-LIF-loo-us',definition:'Pleasantly smooth, rich, and musical to hear.'},{word:'Luminous',pronunciation:'LOO-muh-nus',definition:'Bright, shining, or intellectually clear and inspiring.'},{word:'Tenacious',pronunciation:'tuh-NAY-shus',definition:'Persistent and determined; unwilling to give up.'},{word:'Discerning',pronunciation:'dih-SUR-ning',definition:'Showing good judgment and the ability to notice subtle differences.'},{word:'Ingenious',pronunciation:'in-JEEN-yus',definition:'Clever, original, and skillful in inventing or solving problems.'},{word:'Eloquent',pronunciation:'EL-uh-kwuhnt',definition:'Fluent, persuasive, and graceful in speaking or writing.'},{word:'Meticulous',pronunciation:'muh-TIK-yuh-lus',definition:'Extremely careful and precise about small details.'},{word:'Serene',pronunciation:'suh-REEN',definition:'Calm, peaceful, and untroubled.'},{word:'Vivacious',pronunciation:'vih-VAY-shus',definition:'Attractively lively, animated, and full of spirit.'},{word:'Compassionate',pronunciation:'kuhm-PASH-uh-nit',definition:'Feeling and showing concern for the suffering or needs of others.'},{word:'Inventive',pronunciation:'in-VEN-tiv',definition:'Skilled at creating new ideas, methods, or things.'},{word:'Poised',pronunciation:'poyzd',definition:'Composed, self-assured, and graceful.'},{word:'Astute',pronunciation:'uh-STOOT',definition:'Very perceptive and able to judge situations accurately.'},{word:'Benevolent',pronunciation:'buh-NEV-uh-luhnt',definition:'Kind, generous, and wishing good for others.'},{word:'Candid',pronunciation:'KAN-did',definition:'Truthful, direct, and open in expression.'},{word:'Conscientious',pronunciation:'kon-shee-EN-shus',definition:'Careful, responsible, and guided by a desire to do what is right.'},{word:'Earnest',pronunciation:'UR-nist',definition:'Sincere, serious, and deeply committed.'},{word:'Empathetic',pronunciation:'em-puh-THET-ik',definition:'Able to understand and share another person’s feelings.'},{word:'Exuberant',pronunciation:'ig-ZOO-ber-uhnt',definition:'Filled with lively energy, excitement, and enthusiasm.'},{word:'Forthright',pronunciation:'FORTH-ryt',definition:'Direct, honest, and straightforward.'},{word:'Insightful',pronunciation:'IN-site-fuhl',definition:'Showing a deep and accurate understanding of something.'},{word:'Intuitive',pronunciation:'in-TOO-uh-tiv',definition:'Able to understand or know something instinctively.'},{word:'Judicious',pronunciation:'joo-DISH-us',definition:'Showing careful, sensible judgment.'},{word:'Loyal',pronunciation:'LOY-uhl',definition:'Faithful and steadfast in support or devotion.'},{word:'Nurturing',pronunciation:'NUR-cher-ing',definition:'Encouraging growth and well-being through care and support.'},{word:'Perceptive',pronunciation:'per-SEP-tiv',definition:'Quick to notice, understand, or interpret subtle details.'},{word:'Prudent',pronunciation:'PROO-duhnt',definition:'Wise and careful about practical decisions and future consequences.'},{word:'Resourceful',pronunciation:'rih-SORS-fuhl',definition:'Skilled at finding clever ways to overcome difficulties.'},{word:'Sincere',pronunciation:'sin-SEER',definition:'Genuine, honest, and free from pretense.'},{word:'Spirited',pronunciation:'SPEER-it-id',definition:'Full of energy, courage, enthusiasm, or determination.'},{word:'Tactful',pronunciation:'TAKT-fuhl',definition:'Careful to avoid offending or upsetting others unnecessarily.'},{word:'Unassuming',pronunciation:'un-uh-SOO-ming',definition:'Modest and not seeking attention or admiration.'},{word:'Versatile',pronunciation:'VUR-suh-tuhl',definition:'Able to adapt to many different tasks, roles, or situations.'},{word:'Whimsical',pronunciation:'WIM-zih-kuhl',definition:'Playfully unusual, imaginative, or charmingly fanciful.'},{word:'Zealous',pronunciation:'ZEL-us',definition:'Showing intense enthusiasm or devotion.'},{word:'Altruistic',pronunciation:'al-troo-IS-tik',definition:'Concerned selflessly with the well-being of others.'},{word:'Amiable',pronunciation:'AY-mee-uh-buhl',definition:'Friendly, pleasant, and easy to like.'},{word:'Articulate',pronunciation:'ar-TIK-yuh-lit',definition:'Able to express ideas clearly and effectively.'},{word:'Authentic',pronunciation:'aw-THEN-tik',definition:'Genuine, true, and not false or imitated.'},{word:'Charismatic',pronunciation:'kar-iz-MAT-ik',definition:'Having a compelling charm that attracts or inspires others.'},{word:'Clever',pronunciation:'KLEV-er',definition:'Quick to understand, learn, or devise effective ideas.'},{word:'Composed',pronunciation:'kuhm-POHZD',definition:'Calm and in control of one’s emotions and behavior.'},{word:'Decisive',pronunciation:'dih-SY-siv',definition:'Able to make choices quickly and confidently.'},{word:'Devoted',pronunciation:'dih-VOH-tid',definition:'Very loving, loyal, and committed.'},{word:'Diligent',pronunciation:'DIL-uh-juhnt',definition:'Careful and persistent in work or effort.'},{word:'Dynamic',pronunciation:'dy-NAM-ik',definition:'Energetic, forceful, and capable of change or progress.'},{word:'Encouraging',pronunciation:'en-KUR-ij-ing',definition:'Giving support, confidence, or hope.'},{word:'Faithful',pronunciation:'FAYTH-fuhl',definition:'Loyal, dependable, and steadfast.'},{word:'Gracious',pronunciation:'GRAY-shus',definition:'Courteous, kind, and pleasantly generous in manner.'},{word:'Grounded',pronunciation:'GROWN-did',definition:'Sensible, emotionally stable, and connected to reality.'},{word:'Innovative',pronunciation:'IN-uh-vay-tiv',definition:'Introducing new ideas, methods, or approaches.'},{word:'Observant',pronunciation:'ub-ZUR-vuhnt',definition:'Quick to notice and pay attention to details.'},{word:'Original',pronunciation:'uh-RIJ-uh-nuhl',definition:'Fresh, distinctive, and not copied from something else.'},{word:'Reflective',pronunciation:'rih-FLEK-tiv',definition:'Thoughtful and inclined to carefully consider ideas or experiences.'},{word:'Reliable',pronunciation:'rih-LY-uh-buhl',definition:'Consistently dependable and trustworthy.'},{word:'Selfless',pronunciation:'SELF-lis',definition:'More concerned with others’ needs than one’s own advantage.'},{word:'Skillful',pronunciation:'SKIL-fuhl',definition:'Having or showing practiced ability and expertise.'},{word:'Tenderhearted',pronunciation:'TEN-der-har-tid',definition:'Compassionate, gentle, and easily moved by others’ needs.'},{word:'Visionary',pronunciation:'VIZH-uh-nair-ee',definition:'Able to imagine wise or creative possibilities for the future.'},{word:'Witty',pronunciation:'WIT-ee',definition:'Clever and amusing in expression.'},{word:'Abstemious',pronunciation:'ab-STEE-mee-us',definition:'Moderate and restrained, especially in eating or drinking.'},{word:'Ambivalent',pronunciation:'am-BIV-uh-luhnt',definition:'Having mixed or contradictory feelings about something.'},{word:'Austere',pronunciation:'aw-STEER',definition:'Severe, plain, or strict in manner or appearance.'},{word:'Bellicose',pronunciation:'BEL-ih-kohs',definition:'Aggressive and eager to fight or argue.'},{word:'Circumspect',pronunciation:'SUR-kuhm-spekt',definition:'Careful to consider risks and consequences before acting.'},{word:'Cogent',pronunciation:'KOH-juhnt',definition:'Clear, logical, and convincing.'},{word:'Convivial',pronunciation:'kuhn-VIV-ee-uhl',definition:'Friendly, lively, and enjoyable in company.'},{word:'Copious',pronunciation:'KOH-pee-us',definition:'Abundant or plentiful in quantity.'},{word:'Deferential',pronunciation:'def-uh-REN-shuhl',definition:'Showing respectful submission or regard for another person.'},{word:'Didactic',pronunciation:'dy-DAK-tik',definition:'Intended to teach, sometimes in an overly instructive way.'},{word:'Diffident',pronunciation:'DIF-ih-duhnt',definition:'Modest or shy because of a lack of self-confidence.'},{word:'Eclectic',pronunciation:'ih-KLEK-tik',definition:'Drawing ideas or styles from a broad and varied range of sources.'},{word:'Effervescent',pronunciation:'ef-er-VES-uhnt',definition:'Vivacious, enthusiastic, and full of lively energy.'},{word:'Enigmatic',pronunciation:'en-ig-MAT-ik',definition:'Mysterious and difficult to understand or interpret.'},{word:'Ephemeral',pronunciation:'ih-FEM-er-uhl',definition:'Lasting for only a very short time.'},{word:'Erudite',pronunciation:'AIR-yoo-dyt',definition:'Having or showing extensive scholarly knowledge.'},{word:'Esoteric',pronunciation:'es-uh-TER-ik',definition:'Understood by or intended for only a small group with special knowledge.'},{word:'Exigent',pronunciation:'EK-sih-juhnt',definition:'Urgent, pressing, or demanding immediate attention.'},{word:'Gregarious',pronunciation:'grih-GAIR-ee-us',definition:'Sociable and fond of being with other people.'},{word:'Impetuous',pronunciation:'im-PECH-oo-us',definition:'Acting quickly without enough thought or care.'},{word:'Incisive',pronunciation:'in-SY-siv',definition:'Clear, sharp, and intelligently analytical.'},{word:'Ineffable',pronunciation:'in-EF-uh-buhl',definition:'Too great, beautiful, or extreme to be adequately expressed in words.'},{word:'Intrepid',pronunciation:'in-TREP-id',definition:'Fearless, adventurous, and resolute.'},{word:'Laconic',pronunciation:'luh-KON-ik',definition:'Using very few words.'},{word:'Loquacious',pronunciation:'loh-KWAY-shus',definition:'Very talkative.'},{word:'Lucid',pronunciation:'LOO-sid',definition:'Clear, easy to understand, or mentally coherent.'},{word:'Munificent',pronunciation:'myoo-NIF-uh-suhnt',definition:'Extremely generous in giving.'},{word:'Nebulous',pronunciation:'NEB-yuh-lus',definition:'Vague, unclear, or ill-defined.'},{word:'Obstinate',pronunciation:'OB-stuh-nit',definition:'Stubbornly refusing to change one’s opinion or course of action.'},{word:'Pragmatic',pronunciation:'prag-MAT-ik',definition:'Focused on practical results rather than theory or ideals alone.'},{word:'Prodigious',pronunciation:'pruh-DIJ-us',definition:'Remarkably great in size, degree, ability, or extent.'},{word:'Prolific',pronunciation:'pruh-LIF-ik',definition:'Producing a large amount of work, results, or creations.'},{word:'Quixotic',pronunciation:'kwik-SOT-ik',definition:'Idealistic in an impractical or unrealistic way.'},{word:'Reticent',pronunciation:'RET-ih-suhnt',definition:'Reserved and not revealing one’s thoughts or feelings readily.'},{word:'Scrupulous',pronunciation:'SKROO-pyuh-lus',definition:'Very careful to act correctly, honestly, and precisely.'},{word:'Stoic',pronunciation:'STOH-ik',definition:'Enduring pain or difficulty without openly showing distress.'},{word:'Trenchant',pronunciation:'TREN-chuhnt',definition:'Sharp, forceful, and effective in expression or analysis.'},{word:'Ubiquitous',pronunciation:'yoo-BIK-wih-tus',definition:'Present, appearing, or found everywhere.'},{word:'Venerable',pronunciation:'VEN-er-uh-buhl',definition:'Respected because of age, wisdom, character, or achievement.'},{word:'Winsome',pronunciation:'WIN-suhm',definition:'Sweetly charming and appealing.'},{word:'Wistful',pronunciation:'WIST-fuhl',definition:'Having a quiet, thoughtful longing for something.'},{word:'Acrimonious',pronunciation:'ak-rih-MOH-nee-us',definition:'Bitter, angry, and harsh in tone or manner.'},{word:'Aplomb',pronunciation:'uh-PLOM',definition:'Self-confidence and composure in a difficult situation.'},{word:'Assiduous',pronunciation:'uh-SIJ-oo-us',definition:'Showing persistent, careful, and hardworking attention.'},{word:'Capricious',pronunciation:'kuh-PRISH-us',definition:'Given to sudden, unpredictable changes in mood or behavior.'},{word:'Demure',pronunciation:'dih-MYOOR',definition:'Reserved, modest, and quietly composed in manner.'},{word:'Ebullient',pronunciation:'ih-BULL-yuhnt',definition:'Cheerful, energetic, and overflowing with enthusiasm.'},{word:'Fervent',pronunciation:'FUR-vuhnt',definition:'Showing intense passion, warmth, or sincerity.'},{word:'Immutable',pronunciation:'ih-MYOO-tuh-buhl',definition:'Unable or unlikely to change.'},{word:'Inimitable',pronunciation:'ih-NIM-ih-tuh-buhl',definition:'So distinctive or excellent that it cannot be copied.'},{word:'Magniloquent',pronunciation:'mag-NIL-uh-kwuhnt',definition:'Using grand, lofty, or extravagant language.'},{word:'Nonchalant',pronunciation:'non-shuh-LAHNT',definition:'Calm and casually unconcerned.'},{word:'Nuanced',pronunciation:'NOO-ahnst',definition:'Characterized by subtle distinctions or fine shades of meaning.'},{word:'Pensive',pronunciation:'PEN-siv',definition:'Deeply thoughtful, often with a slightly serious or wistful mood.'},{word:'Piquant',pronunciation:'PEE-kuhnt',definition:'Pleasantly stimulating, interesting, or sharply flavored.'},{word:'Reverent',pronunciation:'REV-er-uhnt',definition:'Showing deep respect, awe, or devotion.'},{word:'Subtle',pronunciation:'SUT-uhl',definition:'Delicate, understated, or not immediately obvious.'},{word:'Unflappable',pronunciation:'un-FLAP-uh-buhl',definition:'Remaining calm and composed even under pressure.'},{word:'Veracious',pronunciation:'vuh-RAY-shus',definition:'Truthful and accurate.'}
  ];
  let mode='both',score=0,streak=0,count=1,last=-1,currentMode='both',scored=false;
  function pickWord(){let idx;do{idx=Math.floor(Math.random()*words.length)}while(words.length>1&&idx===last);last=idx;return words[idx];}
  function resolveMode(){if(mode!=='random') return mode;return ['synonym','antonym','both'][Math.floor(Math.random()*3)];}
  function promptFor(m){if(m==='synonym')return 'Give a synonym.';if(m==='antonym')return 'Give an antonym.';return 'Give a synonym and an antonym.';}
  function newCard(){card.classList.remove('flipped');scored=false;currentMode=resolveMode();const current=pickWord();wordEl.textContent=current.word;pronunciationEl.textContent=current.pronunciation;definitionEl.textContent=current.definition;promptEl.textContent=promptFor(currentMode);countEl.textContent=String(count);live.textContent=`Card ${count}: ${current.word}`;}
  function flip(){card.classList.toggle('flipped');}
  function markCorrect(){if(scored)return;scored=true;score+=1;streak+=1;scoreEl.textContent=score;streakEl.textContent=streak;live.textContent='Point scored.';}
  function skip(){if(!scored){streak=0;streakEl.textContent=streak;scored=true;}live.textContent='Skipped.';}
  function next(){count+=1;newCard();}
  function reset(){score=0;streak=0;count=1;scoreEl.textContent='0';streakEl.textContent='0';newCard();live.textContent='Game reset.';}
  card.addEventListener('click',flip);card.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();}});correctBtn.addEventListener('click',markCorrect);skipBtn.addEventListener('click',skip);nextBtn.addEventListener('click',next);resetBtn.addEventListener('click',reset);modeBtns.forEach(btn=>btn.addEventListener('click',()=>{mode=btn.dataset.mode;modeBtns.forEach(b=>b.classList.toggle('active',b===btn));count=1;newCard();}));newCard();
})();
</script>
</div></body></html>
