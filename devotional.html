<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily Devotional</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4efe8;color:#332d3b}body{font-family:Georgia,'Times New Roman',serif;padding:24px}.wrap{max-width:780px;margin:0 auto}.eyebrow{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-transform:uppercase;letter-spacing:.16em;font-size:.76rem;color:#7a678f;margin-bottom:8px}.hero{background:#fffaf4;border:1px solid #e6d9ec;border-radius:24px;padding:28px;box-shadow:0 12px 30px rgba(63,42,80,.08)}h1{margin:0 0 6px;font-size:clamp(2rem,7vw,3.6rem);line-height:1.02;color:#5f467a}.meta{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#806f88;font-size:.95rem;margin-bottom:22px}.verse{font-size:1.18rem;line-height:1.65;padding:18px 20px;border-left:4px solid #9a7ab8;background:#f6f0fa;border-radius:0 16px 16px 0;margin-bottom:26px}.body p{font-size:1.08rem;line-height:1.78;margin:0 0 1.15em}.reflection{margin-top:28px;padding:20px;border-radius:18px;background:#efe7f5}.reflection strong{display:block;margin-bottom:8px;color:#654b7d}.signed{margin-top:24px;font-style:italic;color:#6f6274}.archive{margin-top:34px}.archive h2{font-size:1.5rem;margin-bottom:14px}.archive-list{display:grid;gap:12px}.archive-item{width:100%;text-align:left;border:1px solid #dfd4e5;background:#fff;border-radius:16px;padding:16px 18px;color:#3e3545;cursor:pointer}.archive-item strong{display:block;font-family:Georgia,'Times New Roman',serif;font-size:1.08rem}.archive-item span{display:block;margin-top:5px;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#817287;font-size:.88rem}.archive-item.active{border-color:#9a7ab8;background:#f7f1fb}@media(max-width:560px){body{padding:14px}.hero{padding:22px 18px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero" id="entry"></section>
  <section class="archive">
    <div class="eyebrow">Saved reflections</div>
    <h2>Previous Devotionals</h2>
    <div class="archive-list" id="archive"></div>
  </section>
</div>
<script src="devotionals.js"></script>
<script>
(()=>{
 const entries=(window.AJONTE_DEVOTIONALS||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
 const entryEl=document.getElementById('entry'),archiveEl=document.getElementById('archive');
 function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
 function render(item){
   entryEl.innerHTML=`<div class="eyebrow">Daily Devotional</div><h1>${esc(item.title)}</h1><div class="meta">${esc(item.displayDate)} · ${esc(item.reference)} · ${esc(item.translation)}</div><div class="verse">“${esc(item.verse)}”</div><div class="body">${item.body.map(p=>`<p>${esc(p)}</p>`).join('')}</div><div class="reflection"><strong>Reflection</strong>${esc(item.reflection)}</div><div class="signed">— ${esc(item.author)}</div>`;
   [...archiveEl.children].forEach((b,i)=>b.classList.toggle('active',entries[i]===item));
   window.scrollTo({top:0,behavior:'smooth'});
 }
 entries.forEach((item,i)=>{const b=document.createElement('button');b.className='archive-item';b.type='button';b.innerHTML=`<strong>${esc(item.title)}</strong><span>${esc(item.displayDate)} · ${esc(item.reference)}</span>`;b.addEventListener('click',()=>render(item));archiveEl.appendChild(b)});
 if(entries.length)render(entries[0]);else entryEl.innerHTML='<div class="eyebrow">Daily Devotional</div><h1>Coming soon</h1>';
})();
</script>
</body>
</html>
