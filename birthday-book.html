<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birthday Book</title></head><body style="margin:0"><div id="joey-book-authentic" class="jba-root">
<style>
.jba-root{background-color:light-dark(#e9e1d5,#171512);color:light-dark(#2f2922,#f4eee5);border-radius:0;width:100%;padding:clamp(16px,4vw,42px);box-sizing:border-box;font-family:Georgia,'Times New Roman',serif}
.jba-shell{max-width:920px;margin:0 auto}.jba-head{text-align:center;margin-bottom:18px}.jba-kicker{font:700 12px/1.2 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;opacity:.62}.jba-head h2{font-size:clamp(30px,6vw,50px);line-height:1.05;margin:6px 0 7px;font-weight:500}.jba-head p{font:400 14px/1.5 system-ui,sans-serif;opacity:.7;margin:0}
.jba-stage{display:flex;justify-content:center;padding:10px 0 20px}.jba-book{position:relative;width:min(100%,750px);aspect-ratio:4/3;perspective:1400px;touch-action:pan-y;user-select:none}.jba-back{position:absolute;inset:12px 4px 0 17px;border-radius:10px;background:#b7a990;transform:rotate(.7deg)}.jba-stack{position:absolute;inset:6px 11px 7px 8px;border-radius:9px;background:#ede4d5;box-shadow:0 18px 42px rgba(45,34,23,.18)}
.jba-page{position:absolute;inset:0;background:#fff9ee;border-radius:9px;border:1px solid rgba(78,61,43,.2);overflow:hidden;transform-origin:left center;transition:transform .38s cubic-bezier(.2,.75,.25,1);box-shadow:0 16px 36px rgba(52,42,30,.13);color:#2d261f!important}.jba-page *{color:inherit}.jba-page.turning{transform:rotateY(-12deg) translateX(2px)}
.jba-inner{position:absolute;inset:0;padding:clamp(28px,5vw,58px);display:flex;flex-direction:column;justify-content:center;box-sizing:border-box;overflow:auto;color:#2d261f!important}.jba-title{font-size:clamp(27px,5vw,44px);line-height:1.08;margin:0 0 20px;font-weight:500;color:#684e50!important}.jba-copy{font-size:clamp(16px,2.25vw,20px);line-height:1.6;max-width:660px;color:#2d261f!important}.jba-copy p{margin:0 0 14px}.jba-copy p:last-child{margin-bottom:0}.jba-em{font-style:italic;color:#684e50!important}.jba-cover{text-align:center;align-items:center}.jba-cover .small{font:700 12px/1.2 system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#756756!important;margin-bottom:16px}.jba-cover h1{font-size:clamp(48px,10vw,86px);line-height:.94;margin:0 0 12px;font-style:italic;font-weight:500;color:#684e50!important}.jba-cover .date{font-size:clamp(17px,3vw,23px);color:#665b50!important;margin-bottom:30px}.jba-cover .tag{font-size:clamp(19px,3.4vw,28px);line-height:1.35;max-width:520px;color:#2d261f!important}.jba-center{text-align:center;align-items:center}.jba-verse{font-size:clamp(22px,4vw,35px);line-height:1.45;max-width:620px;color:#5f4848!important}.jba-amen{font-size:clamp(25px,4vw,38px);font-style:italic;margin-top:26px;color:#684e50!important}.jba-num{position:absolute;right:18px;bottom:13px;font:600 11px/1 system-ui,sans-serif;color:#857767!important}.jba-spine{position:absolute;left:13px;top:7%;bottom:7%;width:4px;border-radius:5px;background:rgba(88,69,49,.14)}
.jba-hyd{position:absolute;right:22px;top:22px;width:92px;height:92px;opacity:.16}.jba-oak{position:absolute;left:18px;bottom:16px;width:78px;height:78px;opacity:.12;transform:rotate(-20deg)}
.jba-controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}.jba-btn{appearance:none;border:1px solid light-dark(rgba(55,45,34,.22),rgba(255,255,255,.2));background:light-dark(#fffaf0,#2b2924);color:inherit;border-radius:999px;min-height:44px;padding:10px 16px;font:700 14px/1 system-ui,sans-serif;cursor:pointer}.jba-btn.primary{background:light-dark(#4a3f34,#efe2cf);color:light-dark(#fffaf0,#211d18);border-color:transparent}.jba-btn:disabled{opacity:.35;cursor:not-allowed}.jba-btn:focus-visible{outline:3px solid #8f786a;outline-offset:2px}.jba-dots{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:14px auto 0;max-width:540px}.jba-dot{width:9px;height:9px;border-radius:50%;border:0;background:light-dark(#b7aa99,#5a554d);padding:0;cursor:pointer}.jba-dot.active{background:light-dark(#684e50,#d6b7ae);transform:scale(1.25)}.jba-live{text-align:center;font:500 12px/1.5 system-ui,sans-serif;opacity:.62;margin-top:10px}
@media(max-width:560px){.jba-root{padding:16px 10px 24px}.jba-book{width:98%;aspect-ratio:3/4}.jba-inner{padding:32px 25px}.jba-copy{font-size:15.5px;line-height:1.5}.jba-title{margin-bottom:15px}.jba-hyd{width:68px;height:68px}.jba-oak{width:56px;height:56px}}
@media(prefers-reduced-motion:reduce){.jba-page{transition:none}}
</style>
<div class="jba-shell">
<div class="jba-head"><div class="jba-kicker">A little birthday book</div><h2>For Joey</h2><p>Swipe the page or use the buttons below.</p></div>
<div class="jba-stage"><div class="jba-book" id="jbaBook" tabindex="0" aria-label="Birthday book for Joey. Swipe left or right to turn pages.">
<div class="jba-back"></div><div class="jba-stack"></div><article class="jba-page" id="jbaPage">
<svg class="jba-hyd" viewBox="0 0 100 100" aria-hidden="true"><g fill="#8da4c5"><circle cx="50" cy="28" r="11"/><circle cx="35" cy="38" r="11"/><circle cx="65" cy="40" r="12"/><circle cx="45" cy="53" r="12"/><circle cx="70" cy="57" r="10"/><circle cx="29" cy="57" r="10"/></g><path d="M50 61 C52 76 48 88 44 97 M57 64 C64 76 72 86 82 92" stroke="#65745f" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
<svg class="jba-oak" viewBox="0 0 100 100" aria-hidden="true"><path d="M49 7 C29 19 18 35 25 49 C10 58 11 76 28 80 C31 94 48 97 59 85 C72 95 88 88 88 71 C99 59 90 44 77 42 C78 25 65 12 49 7Z" fill="#61725b"/><path d="M48 18 C52 42 51 64 48 92" stroke="#45513f" stroke-width="5" fill="none" stroke-linecap="round"/></svg>
<div class="jba-inner" id="jbaInner"></div><div class="jba-spine"></div><div class="jba-num" id="jbaNum"></div></article></div></div>
<div class="jba-controls"><button type="button" class="jba-btn" id="jbaPrev">◀ Back</button><button type="button" class="jba-btn primary" id="jbaNext">Turn page ▶</button><button type="button" class="jba-btn" id="jbaCover">Cover</button></div>
<div class="jba-dots" id="jbaDots"></div><div class="jba-live" id="jbaLive" aria-live="polite"></div>
</div>
<script>
(()=>{
const root=document.getElementById('joey-book-authentic'),inner=root.querySelector('#jbaInner'),page=root.querySelector('#jbaPage'),num=root.querySelector('#jbaNum'),prev=root.querySelector('#jbaPrev'),next=root.querySelector('#jbaNext'),cover=root.querySelector('#jbaCover'),dots=root.querySelector('#jbaDots'),live=root.querySelector('#jbaLive'),book=root.querySelector('#jbaBook');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let i=0,start=null;
const pages=[
{type:'cover',html:`<div class="small">August 12</div><h1>For Jon</h1><div class="date">A little book about you.</div><div class="tag">Just some things I wanted you to know.</div>`},
{title:'The Little Things About You',html:`<p>There are so many little things about you that I’ve just come to love.</p><p>The way you wrinkle your nose. That little bump on your finger. 😂</p><p>And the way you get itchy whenever something has you stressed or worried. It is genuinely silly.</p><p>And of course, we have to take notice of the random dance breaks.</p><p>You’re just so full of joy and life.</p>`},
{title:'The Kind of Person You Are',html:`<p>You bring understanding into every relationship.</p><p>You’re kind, and you have such a gentle spirit.</p><p>You clothe yourself in dignity and meekness. I see it in the way you dress, but also just in the way you behave and carry yourself.</p><p>You don’t have to force anything. That gentleness is already part of who you are.</p>`},
{title:'You Make Things',html:`<p>You make things.</p><p>You sew. You make clothes. You can have an idea in your head and actually sit down and create it.</p><p>You meal prep. You plan things out and put care into what you make.</p><p>And you write. Poems, stories — and you’re actually really good at it.</p><p>I think there’s something special about somebody who can make things with their hands and with their mind.</p><p>You have a lot in you, Jon.</p>`},
{title:'Things I Hope You Know',html:`<p>The day you came onto this earth — the day you were born — God decided to bless everybody who would ever come into contact with you.</p><p>You’re special. You’re rare. You’re genuine.</p><p>Being around you is a blessing in and of itself.</p>`},
{title:'I Think You’re Brilliant',html:`<p>I think you are brilliant.</p><p>You have a mind on you, and I really don’t think there is anything you couldn’t do if you truly tried at it and understood it.</p><p>I hope you know how capable you are.</p><p>I hope you never talk yourself out of the things you could become just because you haven’t figured them out yet.</p>`},
{title:'You Have Something to Give',html:`<p>I think you have something to offer the world.</p><p>Maybe it’s in the ways you create. Maybe it’s in the things you write. Maybe it’s in all the ways you give of yourself.</p><p>Or maybe sometimes it’s just your kindness and consideration.</p><p>I don’t know exactly what all God is going to do with your life.</p><p>I just know the world is better because you are in it.</p>`},
{title:'What I Hope for You',html:`<p>I hope this year is everything you dreamed of, and all the good things you need that you haven’t even dreamed of yet.</p><p>I hope it’s peaceful.</p><p>I hope it’s joyful.</p><p>I hope it’s loving.</p><p>And I hope you get everything your heart dreams of.</p><p>And I pray you let all of it prepare you for whatever God has next for you.</p>`},
{type:'blessing',html:`<div class="jba-verse">The Lord bless you and keep you.<br><br>May His face shine upon you and be gracious to you.</div><div class="jba-amen">Amen.</div>`},
{type:'closing',html:`<h1 class="jba-title" style="text-align:center;font-size:clamp(36px,7vw,64px)">Happy Birthday, Jon</h1><div class="jba-copy" style="text-align:center"><p>Thank you for being you.</p><p>Thank you for being here.</p><p>There is no one like you.</p><p class="jba-em" style="margin-top:24px;font-size:1.18em">Happy Birthday, Jon.</p></div>`}
];
function render(){const p=pages[i];inner.className='jba-inner'+(p.type==='cover'?' jba-cover':(p.type==='blessing'||p.type==='closing')?' jba-center':'');inner.innerHTML=p.title?`<h3 class="jba-title">${p.title}</h3><div class="jba-copy">${p.html}</div>`:p.html;num.textContent=`${i+1} / ${pages.length}`;prev.disabled=i===0;next.disabled=i===pages.length-1;next.textContent=i===pages.length-1?'The end':'Turn page ▶';live.textContent=`Page ${i+1} of ${pages.length}`;[...dots.children].forEach((d,n)=>d.classList.toggle('active',n===i));}
function go(n){const t=Math.max(0,Math.min(pages.length-1,n));if(t===i)return;page.classList.add('turning');setTimeout(()=>{i=t;render();page.classList.remove('turning')},reduced?0:160)}
pages.forEach((_,n)=>{const d=document.createElement('button');d.type='button';d.className='jba-dot';d.setAttribute('aria-label',`Go to page ${n+1}`);d.addEventListener('click',()=>go(n));dots.appendChild(d)});prev.addEventListener('click',()=>go(i-1));next.addEventListener('click',()=>go(i+1));cover.addEventListener('click',()=>go(0));book.addEventListener('pointerdown',e=>start={x:e.clientX,y:e.clientY});book.addEventListener('pointerup',e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.abs(dx)>38&&Math.abs(dx)>Math.abs(dy))go(i+(dx<0?1:-1))});book.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();go(i+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(i-1)}});render();
})();
</script>
</div></body></html>
