<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday Ajonte</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#bca6d9}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:flex-start;overflow-x:hidden}
.cover{position:relative;width:min(100vw,768px);margin:0 auto;background:#bca6d9;box-shadow:0 0 40px rgba(55,35,75,.18)}
.cover img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.hotspot{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;-webkit-tap-highlight-color:transparent}
.hotspot:focus-visible{outline:4px solid #fff;outline-offset:4px;box-shadow:0 0 0 8px rgba(104,74,155,.75)}
.gift{top:88.1%;height:9.7%;border-radius:50%;background:#fff8ef;border:2px solid rgba(104,74,155,.16);box-shadow:0 6px 18px rgba(74,51,95,.12);color:#684a8f;font-family:Georgia,'Times New Roman',serif;font-weight:700;line-height:1.06;padding:8px;font-size:clamp(11px,2.1vw,16px)}
.flipbook{left:13.5%;width:22.5%}.book{left:38.5%;width:23%}.cards{left:64%;width:22.5%;font-size:clamp(9px,1.75vw,13px)}
.enter{left:33%;top:65.4%;width:34%;height:6.2%;border-radius:999px;background:transparent}
.devotional{left:27%;top:73.7%;width:46%;height:5.7%;border-radius:999px;background:rgba(255,250,244,.97);border:2px solid rgba(104,74,155,.2);box-shadow:0 7px 20px rgba(74,51,95,.16);color:#684a8f;font-family:Georgia,'Times New Roman',serif;font-weight:800;font-size:clamp(11px,2.05vw,16px);letter-spacing:.01em}.devotional::before{content:'📖';margin-right:.5em;font-size:1.05em}
.game{left:31%;top:80.5%;width:38%;height:5.6%;border-radius:999px;background:linear-gradient(180deg,#fffaf3,#f1e5ff);border:2px solid rgba(104,74,155,.22);box-shadow:0 7px 20px rgba(74,51,95,.18);color:#684a8f;font-family:Georgia,'Times New Roman',serif;font-weight:800;font-size:clamp(11px,2.1vw,16px);letter-spacing:.01em}.game::before{content:'🎲';margin-right:.45em;font-size:1.05em}
.music-control{position:fixed;right:14px;top:max(14px,env(safe-area-inset-top));z-index:1001;border:1px solid rgba(104,74,155,.25);background:rgba(255,248,239,.94);color:#684a8f;border-radius:999px;padding:10px 14px;font-weight:800;box-shadow:0 6px 20px rgba(55,35,75,.18);backdrop-filter:blur(8px)}
.site-view{position:fixed;inset:0;z-index:1000;background:#bca6d9;display:none;flex-direction:column}.site-view.open{display:flex}.site-bar{height:58px;min-height:58px;padding:8px 12px;display:flex;align-items:center;gap:10px;background:rgba(90,64,126,.96);color:#fff;box-shadow:0 2px 14px rgba(0,0,0,.16)}.site-bar button{border:0;background:#fff;color:#684a8f;border-radius:999px;padding:9px 14px;font-weight:800}.site-title{font-family:Georgia,'Times New Roman',serif;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.site-frame{border:0;width:100%;height:calc(100% - 58px);background:#fff}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(min-width:769px){body{padding:24px 0}.cover{border-radius:24px;overflow:hidden}}
</style>
</head>
<body>
<button class="music-control" id="siteMusic">♫ Music: On</button>
<main class="cover" aria-label="Ajonte birthday gifts">
  <img src="ChatGPT%20Image%20Aug%2012%2C%202026%2C%2012_00_23%20PM.png" alt="Cute illustrated birthday cover for Ajonte with chibi versions of her writing, sewing, drawing, journaling, meal prepping and enjoying a warm drink.">
  <a class="hotspot enter site-link" href="flipbook.html" data-title="Animated Flipbook" aria-label="Open Ajonte's animated birthday flipbook"><span class="sr-only">Enter your gifts</span></a>
  <a class="hotspot devotional site-link" href="devotional.html" data-title="Daily Devotional" aria-label="Open today's devotional">Today's Devotional</a>
  <a class="hotspot game site-link" href="shut-the-box.html" data-title="Shut the Box" aria-label="Play Shut the Box">Play Shut the Box</a>
  <a class="hotspot gift flipbook site-link" href="flipbook.html" data-title="Animated Flipbook" aria-label="Open Animated Flipbook">Flipbook</a>
  <a class="hotspot gift book site-link" href="birthday-book.html" data-title="Birthday Book" aria-label="Open Birthday Book">Birthday Book</a>
  <a class="hotspot gift cards site-link" href="flip-cards.html" data-title="Thesaurians: Flip Cards Edition" aria-label="Open Thesaurians: Flip Cards Edition">Thesaurians:<br>Flip Cards Edition</a>
</main>
<div class="site-view" id="siteView" aria-hidden="true">
  <div class="site-bar"><button id="backHome">← Gifts</button><div class="site-title" id="siteTitle">Ajonte's Birthday</div></div>
  <iframe class="site-frame" id="siteFrame" title="Birthday gift"></iframe>
</div>
<script>
(()=>{
 const musicBtn=document.getElementById('siteMusic'),view=document.getElementById('siteView'),frame=document.getElementById('siteFrame'),title=document.getElementById('siteTitle');
 let ctx=null,master=null,musicOn=localStorage.getItem('ajonteMusic')!=='off',timer=null,started=false,bar=0;
 musicBtn.textContent=musicOn?'♫ Music: On':'♫ Music: Off';
 function init(){if(ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();master=ctx.createGain();master.gain.value=.34;master.connect(ctx.destination)}
 function osc(freq,t,dur,vol,type='sine',cut=1800){init();if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type=type;o.frequency.value=freq;f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05)}
 function noise(t,dur,vol,high=4000){init();if(!ctx)return;const len=Math.floor(ctx.sampleRate*dur),buf=ctx.createBuffer(1,len,ctx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<len;i++)data[i]=Math.random()*2-1;const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=buf;f.type='highpass';f.frequency.value=high;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t)}
 function kick(t,vol=.045){init();if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type='sine';o.frequency.setValueAtTime(88,t);o.frequency.exponentialRampToValueAtTime(46,t+.18);f.type='lowpass';f.frequency.value=180;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+.28);o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+.3)}
 function snare(t){noise(t,.18,.012,1450);osc(155,t,.13,.0045,'triangle',650)}
 function hat(t,accent=false){noise(t,.045,accent?.0045:.0028,7000)}
 function chord(freqs,t,dur=.95,vol=.018){freqs.forEach((f,i)=>osc(f,t+i*.012,dur,vol,i%2?'triangle':'sine',1100))}
 const progression=[
  {bass:65.41,ch:[130.81,164.81,196,246.94,293.66]},
  {bass:73.42,ch:[146.83,174.61,220,261.63,329.63]},
  {bass:55,ch:[110,130.81,164.81,196,246.94]},
  {bass:61.74,ch:[123.47,146.83,185,220,293.66]}
 ];
 function scheduleBar(){if(!ctx||!musicOn)return;const t=ctx.currentTime+.06,b=progression[bar%progression.length];bar++;
   chord(b.ch,t,1.05,.013); chord(b.ch.map(f=>f*1.002),t+2.02,.82,.009);
   osc(b.bass,t,1.35,.038,'sine',360);osc(b.bass*1.5,t+1.52,.78,.019,'sine',360);osc(b.bass,t+2.9,.88,.029,'sine',360);
   kick(t,.042); kick(t+1.86,.028); kick(t+3.12,.036);
   snare(t+.94); snare(t+2.82);
   const hats=[0,.47,.94,1.41,1.88,2.35,2.82,3.29];hats.forEach((x,i)=>hat(t+x,i%2===1));
   if(bar%2===0){const melody=[329.63,293.66,246.94,220];[.3,1.18,2.48,3.34].forEach((x,i)=>osc(melody[i],t+x,.4,.012,'triangle',1200))}
 }
 function startMusic(){init();if(!ctx||!musicOn)return;if(ctx.state==='suspended')ctx.resume();if(started)return;started=true;scheduleBar();timer=setInterval(scheduleBar,3760)}
 function stopMusic(){started=false;if(timer){clearInterval(timer);timer=null}}
 function setMusic(on){musicOn=on;localStorage.setItem('ajonteMusic',on?'on':'off');musicBtn.textContent=on?'♫ Music: On':'♫ Music: Off';if(on)startMusic();else stopMusic()}
 musicBtn.addEventListener('click',()=>setMusic(!musicOn));
 document.addEventListener('pointerdown',()=>{if(musicOn)startMusic()},{once:true});
 document.querySelectorAll('.site-link').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();if(musicOn)startMusic();title.textContent=a.dataset.title||"Ajonte's Birthday";frame.src=a.getAttribute('href');view.classList.add('open');view.setAttribute('aria-hidden','false')}));
 document.getElementById('backHome').addEventListener('click',()=>{view.classList.remove('open');view.setAttribute('aria-hidden','true');frame.src='';title.textContent="Ajonte's Birthday"});
 frame.addEventListener('load',()=>{try{const b=frame.contentDocument&&frame.contentDocument.getElementById('musicBtn');if(b&&/On/i.test(b.textContent))b.click()}catch(e){}});
})();
</script>
</body>
</html>
